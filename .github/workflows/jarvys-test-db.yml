# Jarvys Test Database — MJ1A-V-ENV-CI
#
# Ambiente PostgreSQL/Supabase local, isolado e efêmero, executado somente
# sob demanda no GitHub Actions. NÃO conecta em produção. NÃO usa secrets.
# NÃO faz deploy. NÃO liga orchestrator_mode em produção. NÃO conecta
# runtime produtivo.
#
# Fluxo: checkout → Bun fixo → deps congeladas → testes puros do guard →
# Supabase CLI fixa → sanitização de ambiente → supabase start local →
# supabase db reset --local (aplica migrations + seed sintético) →
# TEST_DATABASE_URL local sem fallback → smoke multi-sessão (2 pg.Client
# físicos independentes, PID distinto, COMMIT, ROLLBACK, zero leaked rows)
# → ratificação MJ1A-V (C1-C7) e MJ1B-V (O1-O5), RPCs reais contra este
# Postgres local efêmero → Step Summary sanitizado → teardown always
# (supabase stop) → runner efêmero descartado.
#
# Todas as `uses:` estão fixadas em SHA hexadecimal completa de 40 caracteres.
# Tags nos comentários são meramente informativas.

name: Jarvys Test Database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvys-test-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-db:
    name: Supabase local + smoke multi-sessão
    runs-on: ubuntu-24.04
    # 30 min: cabe checkout + bun install + migrations aplicadas desde zero
    # + seed + smoke + MJ1A-V (C1-C7) + MJ1B-V (O1-O5) + MJ1C-V (K1-K12).
    # Curto o bastante para não segurar runner em travamentos.
    timeout-minutes: 30

    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # release v7.0.0

      - name: Setup Bun (versão fixa)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # release v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install deps (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Testes puros do guard (sem banco)
        run: bun test scripts/test-db/guard.test.ts

      - name: Setup Supabase CLI (versão fixa)
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # release v3.0.0
        with:
          version: 2.109.1

      - name: Verificar versões
        run: |
          set -euo pipefail
          echo "bun: $(bun --version)"
          echo "supabase: $(supabase --version)"
          echo "docker: $(docker --version)"

      - name: Sanitização do ambiente (fail-closed)
        run: |
          set -euo pipefail
          forbidden=(
            DATABASE_URL
            SUPABASE_DB_URL
            SUPABASE_ACCESS_TOKEN
            SUPABASE_PROJECT_REF
            SUPABASE_DB_PASSWORD
            SUPABASE_SERVICE_ROLE_KEY
            PRODUCTION_DATABASE_URL
            ZAPI_INSTANCE_ID
            ZAPI_TOKEN
            ASAAS_API_KEY
            OPENAI_API_KEY
          )
          leaked=0
          for name in "${forbidden[@]}"; do
            if [ -n "${!name:-}" ]; then
              echo "::error::variável proibida presente no job: $name"
              leaked=$((leaked + 1))
            fi
          done
          if [ "$leaked" -gt 0 ]; then
            echo "abortando: $leaked variável(is) produtiva(s) detectada(s)"
            exit 1
          fi
          echo "env sanitization OK (nenhuma variável produtiva presente)"

      - name: Supabase start (local, logs redigidos)
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvys-ci
          log=/tmp/jarvys-ci/supabase-start.log
          if ! supabase start >"$log" 2>&1; then
            echo "::error::supabase start falhou"
            # imprime trecho sanitizado — remove JWTs, DSNs, senhas, chaves.
            sed -E \
              -e 's#postgres(ql)?://[^ ]+#postgres://[redacted]#g' \
              -e 's#eyJ[A-Za-z0-9_.=/+-]+#[redacted-jwt]#g' \
              -e 's#(anon key|service_role key|JWT secret|DB Password|password)[ :=][^ ]+#\1: [redacted]#gi' \
              "$log" | tail -n 200
            exit 1
          fi
          echo "supabase start OK (log bruto retido apenas no runner efêmero)"

      - name: Supabase db reset (local — aplica migrations + seed)
        run: |
          set -euo pipefail
          log=/tmp/jarvys-ci/supabase-reset.log
          migrations=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')
          echo "migrations detectadas: $migrations"
          if ! supabase db reset --local >"$log" 2>&1; then
            echo "::error::supabase db reset --local falhou"
            sed -E \
              -e 's#postgres(ql)?://[^ ]+#postgres://[redacted]#g' \
              -e 's#eyJ[A-Za-z0-9_.=/+-]+#[redacted-jwt]#g' \
              -e 's#(anon key|service_role key|JWT secret|DB Password|password)[ :=][^ ]+#\1: [redacted]#gi' \
              "$log" | tail -n 200
            exit 1
          fi
          echo "supabase db reset OK ($migrations migrations aplicadas + seed)"

      - name: Definir TEST_DATABASE_URL local
        run: |
          set -euo pipefail
          # Porta externa canônica do Supabase local: 54322. Senha default local: postgres.
          # Nunca lida de secret nem de .env. Nunca ecoada nos logs.
          {
            echo "TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          } >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL definida (valor não ecoado)"

      - name: Smoke multi-sessão
        run: bun run scripts/test-db/smoke.ts

      - name: MJ1A-V C1 — enqueue concorrente (Postgres real)
        run: bun test supabase/tests/mj1a-v/c1-enqueue-concurrent.test.ts

      - name: MJ1A-V C2 — enqueue + rollback libera lock (Postgres real)
        run: bun test supabase/tests/mj1a-v/c2-enqueue-rollback.test.ts

      - name: MJ1A-V C3 — contexto divergente rejeitado (Postgres real)
        run: bun test supabase/tests/mj1a-v/c3-enqueue-context-mismatch.test.ts

      - name: MJ1A-V C4 — finalize_sent webhook duplicado (Postgres real)
        run: bun test supabase/tests/mj1a-v/c4-finalize-sent-duplicate-webhook.test.ts

      - name: MJ1A-V C5 — sucesso vence sempre / terminal não flipa (Postgres real)
        run: bun test supabase/tests/mj1a-v/c5-finalize-terminal-precedence.test.ts

      - name: MJ1A-V C6 — finalize_failed reparo self-heal (Postgres real)
        run: bun test supabase/tests/mj1a-v/c6-finalize-failed-repair.test.ts

      - name: MJ1A-V C7 — auditoria final zero órfão (Postgres real)
        run: bun test supabase/tests/mj1a-v/c7-orphan-audit.test.ts

      - name: MJ1B-V O1 — claim SKIP LOCKED não bloqueia (Postgres real)
        run: bun test supabase/tests/mj1b-v/o1-claim-skip-locked.test.ts

      - name: MJ1B-V O2 — recuperação de lease expirado (Postgres real)
        run: bun test supabase/tests/mj1b-v/o2-lease-recovery.test.ts

      - name: MJ1B-V O3 — replay durável do apply (Postgres real)
        run: bun test supabase/tests/mj1b-v/o3-apply-replay.test.ts

      - name: MJ1B-V O4 — CAS state_version sob lock real (Postgres real)
        run: bun test supabase/tests/mj1b-v/o4-apply-cas-lock.test.ts

      - name: MJ1B-V O5 — corrida 1a insercao de estado (Postgres real)
        run: bun test supabase/tests/mj1b-v/o5-apply-first-insert-race.test.ts

      - name: MJ1B-V O6 — release nao reprocessa duplicata (Postgres real)
        run: bun test supabase/tests/mj1b-v/o6-release-duplicate.test.ts



      - name: MJ1C-V K1 — applied caminho feliz (Postgres real)
        run: bun test supabase/tests/mj1c-v/k1-applied.test.ts

      - name: MJ1C-V K2 — no_op (Postgres real)
        run: bun test supabase/tests/mj1c-v/k2-no-op.test.ts

      - name: MJ1C-V K3 — replay durável (Postgres real)
        run: bun test supabase/tests/mj1c-v/k3-replay.test.ts

      - name: MJ1C-V K4 — km_conflict (Postgres real)
        run: bun test supabase/tests/mj1c-v/k4-km-conflict.test.ts

      - name: MJ1C-V K5 — state_version_conflict (Postgres real)
        run: bun test supabase/tests/mj1c-v/k5-state-version-conflict.test.ts

      - name: MJ1C-V K6 — correction_not_confirmed (Postgres real)
        run: bun test supabase/tests/mj1c-v/k6-correction-not-confirmed.test.ts

      - name: MJ1C-V K7 — vehicle_archived (Postgres real)
        run: bun test supabase/tests/mj1c-v/k7-vehicle-archived.test.ts

      - name: MJ1C-V K8 — vehicle_not_owned (Postgres real)
        run: bun test supabase/tests/mj1c-v/k8-vehicle-not-owned.test.ts

      - name: MJ1C-V K9 — invariant_violation (Postgres real)
        run: bun test supabase/tests/mj1c-v/k9-invariant-violation.test.ts

      - name: MJ1C-V K10 — action_execution_conflict (Postgres real)
        run: bun test supabase/tests/mj1c-v/k10-action-execution-conflict.test.ts

      - name: MJ1C-V K11 — concorrência real no mesmo draft_id (Postgres real)
        run: bun test supabase/tests/mj1c-v/k11-concurrent-same-draft.test.ts

      - name: MJ1C-V K12 — crash-window replay (Postgres real)
        run: bun test supabase/tests/mj1c-v/k12-crash-window-replay.test.ts

      - name: MJ1D-V D1 — corrente completa applied (Postgres real)
        run: bun test supabase/tests/mj1d-v/d1-applied-happy-path.test.ts

      - name: MJ1D-V D2 — km_conflict e retry_needed (Postgres real)
        run: bun test supabase/tests/mj1d-v/d2-km-conflict-retry.test.ts

      - name: MJ1D-V D3 — crash-window replay encadeado com apply (Postgres real)
        run: bun test supabase/tests/mj1d-v/d3-crash-window-replay.test.ts

      - name: MJ2A-V E1 — expense_create applied happy path (Postgres real)
        run: bun test supabase/tests/mj2a-v/e1-happy-path-applied.test.ts

      - name: MJ2A-V E2 — expense_create replay idempotente (Postgres real)
        run: bun test supabase/tests/mj2a-v/e2-replay-idempotent.test.ts

      - name: MJ2A-V E3 — expense_create replay payload mismatch (Postgres real)
        run: bun test supabase/tests/mj2a-v/e3-replay-payload-mismatch.test.ts

      - name: MJ2A-V E4 — expense_create state_version_conflict (Postgres real)
        run: bun test supabase/tests/mj2a-v/e4-state-version-conflict.test.ts

      - name: MJ2A-V E5 — expense_create invalid state (Postgres real)
        run: bun test supabase/tests/mj2a-v/e5-invalid-state.test.ts

      - name: MJ2A-V E6 — expense_create draft_type mismatch (Postgres real)
        run: bun test supabase/tests/mj2a-v/e6-draft-type-mismatch.test.ts

      - name: MJ2A-V E7 — expense_create draft_payload mismatch (Postgres real)
        run: bun test supabase/tests/mj2a-v/e7-draft-payload-mismatch.test.ts

      - name: MJ2A-V E8 — expense_create categoria_invalid (Postgres real)
        run: bun test supabase/tests/mj2a-v/e8-categoria-invalid.test.ts

      - name: MJ2A-V E9 — expense_create valor_invalid (Postgres real)
        run: bun test supabase/tests/mj2a-v/e9-valor-invalid.test.ts

      - name: MJ2A-V E10 — expense_create vehicle_not_owned (Postgres real)
        run: bun test supabase/tests/mj2a-v/e10-vehicle-not-owned.test.ts

      - name: MJ2A-V E11 — expense_create vehicle_archived (Postgres real)
        run: bun test supabase/tests/mj2a-v/e11-vehicle-archived.test.ts

      - name: MJ2A-V E12 — expense_create concorrência real mesmo draft_id (Postgres real)
        run: bun test supabase/tests/mj2a-v/e12-concurrency-same-draft.test.ts

      - name: MJ2B-V F1 — corrente completa applied despesa (Postgres real)
        run: bun test supabase/tests/mj2b-v/f1-chain-applied.test.ts

      - name: MJ2B-V F2 — despesa rejected vehicle_archived + retry_needed (Postgres real)
        run: bun test supabase/tests/mj2b-v/f2-chain-rejected-retry.test.ts

      - name: MJ2B-V F3 — despesa crash-window replay encadeado com apply (Postgres real)
        run: bun test supabase/tests/mj2b-v/f3-chain-crash-replay.test.ts









      - name: Step Summary sanitizado
        if: always()
        run: |
          {
            echo "# Jarvys Test Database"
            echo ""
            echo "- build: MJ1A-V-ENV-CI"
            echo "- runner: ubuntu-24.04"
            echo "- bun: $(bun --version 2>/dev/null || echo n/a)"
            echo "- supabase CLI: $(supabase --version 2>/dev/null || echo n/a)"
            echo "- docker: $(docker --version 2>/dev/null || echo n/a)"
            echo ""
            echo "## Resultado do job"
            echo ""
            echo "- job status: ${{ job.status }}"
            echo "- migrations detectadas: $(ls supabase/migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')"
            echo "- seed executado via \`supabase db reset --local\`"
            echo ""
            echo "## Invariantes de segurança"
            echo ""
            echo "- runtime: \`orchestrator_mode = off\`"
            echo "- MJ1A-V (C1-C7), MJ1B-V (O1-O6), MJ1C-V (K1-K12), MJ1D-V (D1-D3), MJ2A-V (E1-E12) e MJ2B-V (F1-F3) executados neste build — 100% contra Postgres local efêmero, zero conexão com produção"
            echo "- nenhum secret referenciado"
            echo "- nenhum environment declarado"
            echo "- nenhum acesso a banco remoto"
            echo "- teardown solicitado (supabase stop) via always()"
            echo ""
            echo "Detalhes do smoke (PIDs, isolamento, commit, rollback, leaked_rows) foram anexados"
            echo "pelo próprio smoke em passos anteriores. DSN, senha, JWT e keys foram redigidos."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown (sempre)
        if: always()
        run: |
          set +e
          supabase stop >/tmp/jarvys-ci/supabase-stop.log 2>&1
          echo "supabase stop concluído (runner efêmero será descartado)"
